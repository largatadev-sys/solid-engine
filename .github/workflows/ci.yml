name: CI

# Every push on every branch, plus PRs. The promotion pipeline re-checks the same commits at each
# rung (feature -> dev -> preprod -> main), which is the automated half of the cherry-pick footgun
# CLAUDE.md warns about: a subset that built on dev may not build on preprod.
on:
  push:
  # Scoped to `dev` on purpose: the Playwright job below is the merge gate, and an unscoped
  # `pull_request:` would fire its ~8 minutes on a PR to any base — the "minutes for no extra
  # signal" cost ADR-031 decision 2 exists to avoid.
  pull_request:
    branches: [dev]
  # Required for the Playwright job's `workflow_dispatch` guard to be reachable at all; without it
  # that branch of the condition is dead and the job can never be run by hand.
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref; the old one has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which trees changed. Everything below gates on this (H2, ADR-031) so a mobile-only commit does
  # not pay for the backend suite.
  #
  # This lives as a JOB with `if:` gates rather than as workflow-level `paths:` filters across
  # separate files, for two reasons that are easy to get wrong:
  #   1. `needs:` is workflow-scoped, so an aggregator cannot depend on jobs in other files.
  #   2. A workflow skipped by `paths:` never creates its check run, and a required check that was
  #      never created sits Pending forever and blocks the PR. A job skipped by `if:` DOES create
  #      one, reports "skipped", and counts as passing.
  #
  # It fails OPEN: if the diff base cannot be determined, everything runs. A detection bug must
  # cost minutes, never coverage.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable diff base (event=$EVENT) — running everything"
            printf 'backend=true\nmobile=true\nstack=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          match() { echo "$changed" | grep -Eq "$1" && echo true || echo false; }

          backend=$(match '^backend/')
          mobile=$(match '^mobile/')
          # The stack job proves the COMPOSED artifact, so it owns compose, both Dockerfiles, the
          # infra tree and the backend image it builds.
          stack=$(match '^(docker-compose\.yml|infra/|backend/|.*Dockerfile)')
          # A change to CI itself re-proves everything, or the change is unverified.
          if echo "$changed" | grep -Eq '^\.github/workflows/'; then
            backend=true; mobile=true; stack=true
          fi

          printf 'backend=%s\nmobile=%s\nstack=%s\n' "$backend" "$mobile" "$stack" >> "$GITHUB_OUTPUT"
          printf 'selected: backend=%s mobile=%s stack=%s\n' "$backend" "$mobile" "$stack"

  backend:
    name: backend — mvn verify
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Testcontainers uses the runner's Docker daemon; ubuntu-latest ships one preinstalled.
      # `verify` carries failsafe:verify, which is what makes the exit code trustworthy here and
      # NOT trustworthy for a bare `failsafe:integration-test` locally (CLAUDE.md's gotcha).
      - name: Verify (unit + integration on real Postgres)
        working-directory: backend
        run: mvn -B verify

  mobile:
    name: mobile — typecheck + jest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      # In a strict-TS codebase the compiler is half the test suite (P7), so it is a first-class
      # red, not a lint-grade warning.
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Test
        working-directory: mobile
        run: npm test

  stack:
    name: stack — compose up + health smoke
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Proves the composed artifact — Dockerfile, compose wiring, Flyway-on-boot, the storage
      # emulator's healthcheck and its bucket bootstrap — on every push. Without this job, "compose
      # up works from a clean checkout" is only ever proven on machines where it already worked.
      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health)" = "200" ]; then
              echo "health green after ${i}s"
              curl -s http://localhost:8080/v1/health
              exit 0
            fi
            sleep 2
          done
          echo "health never returned 200"
          docker compose ps
          docker compose logs --tail 50
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans

  # The merge gate's expensive rung (H2 ticket 06, ADR-031). PRs to `dev` only — not every push,
  # which would multiply minutes for no extra signal, and not nightly, because an unattended red at
  # 3am that nobody triages is the lying-suite problem restated.
  #
  # It brings up its OWN stack, so its specs seed into a database nobody else can see. That is what
  # makes the shared t1-t5 pool safe here: the accounts are shared, the DATA is not. Pointing this
  # at a deployed rung would invert that and must not be done.
  playwright:
    name: playwright — api + web
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bring up the stack
        run: docker compose up --build -d

      # The preview container is the TRUE build path — npm ci and the export happen INSIDE the
      # image, served by the real Caddy config. `expo export` plus a static server hid a real
      # Cache-Control bug at S0.5; anything cheaper here proves a different artifact.
      # Secrets reach the shell through `env:`, never through `${{ }}` inside `run:` — an
      # interpolated expression is substituted as SOURCE before bash parses it, so a value
      # containing a quote or `$(…)` would execute. `--build-arg NAME` with no `=` forwards the
      # variable from the environment, so no value is ever written into the command line either.
      - name: Build the preview container
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8080
          LARGATA_WEB_BASE_URL: http://localhost:8081
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          docker build -f Dockerfile.web-preview \
            --build-arg EXPO_PUBLIC_API_BASE_URL \
            --build-arg LARGATA_WEB_BASE_URL \
            --build-arg EXPO_PUBLIC_FIREBASE_API_KEY \
            --build-arg EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg EXPO_PUBLIC_FIREBASE_APP_ID \
            --build-arg EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID \
            -t largata-preview:ci .
          # LARGATA_API_UPSTREAM (S4.29) is what lets Caddy proxy crawler-UA hits on /join/* to the
          # backend's Open Graph preview route. `--network host` means localhost IS the runner, so
          # the compose backend's published 8080 is the upstream. Leave it unset and the container
          # still starts, the SPA still serves, and only the crawler path 503s — which reads as a
          # broken feature rather than as missing config. Neither value is a secret; both are
          # literals for the same reason `-e PORT=8081` is.
          docker run -d --name largata-preview --network host \
            -e PORT=8081 -e LARGATA_API_UPSTREAM=localhost:8080 largata-preview:ci

      - name: Wait for backend and preview
        run: |
          for i in $(seq 1 90); do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health || true)
            p=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || true)
            if [ "$b" = "200" ] && [ "$p" = "200" ]; then echo "both up after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "backend=$b preview=$p"
          docker compose ps && docker compose logs --tail 40
          docker logs largata-preview --tail 40 || true
          exit 1

      - name: Install Playwright
        working-directory: mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # workers=2 measured on the first CI run, not guessed: 627 tests, 625 passed, 5.3 minutes.
      - name: Run both projects
        working-directory: mobile
        env:
          LARGATA_TEST_POOL_EMAIL_BASE: ${{ secrets.LARGATA_TEST_POOL_EMAIL_BASE }}
          LARGATA_TEST_POOL_PASSWORD: ${{ secrets.LARGATA_TEST_POOL_PASSWORD }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          LARGATA_API_BASE_URL: http://localhost:8080
          LARGATA_PREVIEW_URL: http://localhost:8081
          LARGATA_WORKERS: '2'
          LARGATA_RETRIES: '1'
        run: npm run smoke

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: mobile/e2e/.artifacts
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker rm -f largata-preview || true
          docker compose down --remove-orphans

  # The ONE required status check on `dev`. It always runs, so it always reports — which is the
  # whole point: a required check that can fail to exist blocks every PR forever.
  #
  # `skipped` counts as pass; only `failure` and `cancelled` are red. Do not rewrite this as
  # `success()` — that treats a legitimately skipped job as a failure and blocks every
  # single-tree PR.
  ci:
    name: ci
    needs: [changes, backend, mobile, stack, playwright]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one job failed or was cancelled"
            exit 1
          fi
          echo "all jobs succeeded or were skipped"
