spring:
  application:
    name: largata-backend
  datasource:
    # Config is env-vars only (Artifact 04). Defaults here are local-dev conveniences, never
    # secrets — real values come from the environment; prod sets them in the platform's UI.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/largata}
    username: ${DATABASE_USERNAME:largata}
    password: ${DATABASE_PASSWORD:largata}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch DDL — an accidental `update` would
      # silently diverge environments from the migration history.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Boot's default is ONE thread, shared by every @Scheduled task: the WS heartbeat that
        # detects dead sessions, and the connection-ticket sweeper. A ping walking a wedged socket
        # would delay both — the mechanism that detects dead sessions blocked by dead sessions.
        size: 4
  servlet:
    multipart:
      # Slightly above ImageIngest.MAX_UPLOAD_BYTES (10 MB) on purpose. Spring rejects at this bound
      # with a container-level error; the domain rejects at 10 MB with a message naming the limit.
      # Leaving room between them means a traveler a little over the line reads our refusal rather
      # than the servlet's, while a wildly oversized upload is still stopped before it is buffered.
      max-file-size: 12MB
      max-request-size: 12MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firebase's issuer for our project (ADR-006). Per-environment: the largata-dev project
          # serves local + dev; prod gets its own project at S0.4 — and preprod must share prod's,
          # or its prod-mirrored Travelers (keyed by Firebase UID) match no one (spec, decision 1).
          # Not a secret: the issuer is public, and the JWKS behind it is public by design.
          issuer-uri: ${FIREBASE_ISSUER_URI:https://securetoken.google.com/largata-dev}

largata:
  auth:
    jwks:
      # Google signs every Firebase ID token with the securetoken service account, so this JWKS is
      # the same for every project — the issuer above stays per-environment, the keys do not.
      # JwtDecoderConfig refreshes this set AHEAD of expiry and serves the cached copy through an
      # outage (cache-ttl / refresh-ahead / outage-tolerance, defaults in the config class). Before
      # that, an expired cache blocked every authenticated request on the refetch, and a slow
      # answer from Google surfaced as "Timeout while waiting for cache refresh (15000ms
      # exceeded)" 500s across the whole API (found during S4.34's e2e runs).
      uri: ${LARGATA_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
  web:
    # Where a shared invite link points (S4.28, ADR-032). The share URL is composed server-side —
    # `<base>/join/<token>` — so links open the web app today and the same URLs can be claimed as
    # Android App Links later without reprinting anything already forwarded through a chat.
    # Per-environment: the local default is the preview container's pinned 8081.
    base-url: ${LARGATA_WEB_BASE_URL:http://localhost:8081}
  api:
    # Where THIS backend is reachable from the public internet (S4.29). The invite card's og:image
    # must be an absolute URL on the API origin: a crawler resolves it against nothing, and some
    # platforms fetch the image with a plain user agent that Caddy's crawler matcher would miss.
    # Per-environment: the local default is the compose backend's 8080.
    base-url: ${LARGATA_API_BASE_URL:http://localhost:8080}
  reports:
    # Where accepted feedback reports are relayed, server-to-server, into worklog's Reports intake
    # (FB-1, worklog contract v1.1). Unset URL = no relay bean = LoggingReportRelay, which "delivers"
    # to the backend log and marks the row delivered. That is the DELIBERATE local and CI posture:
    # worklog's reports are PERMANENT and have no delete, so a walk, a smoke run or a test that
    # reached the real inbox would deposit junk nobody can remove.
    #
    # The secret is a REAL CREDENTIAL, deliberately different per environment (dev↔dev, prod↔prod).
    # It lives in .env locally and in the platform's env-var UI on deployed rungs — never in the
    # repo, never in a log line, never echoed into a shell command.
    intake-url: ${LARGATA_REPORTS_INTAKE_URL:}
    intake-secret: ${LARGATA_REPORTS_INTAKE_SECRET:}
    # How often the outbox drains, and how long it waits before its first drain. The initial delay
    # exists so an integration test can push the autonomous poller past its own lifetime and drive
    # delivery deliberately — without it the poller races the assertions, which passes almost every
    # time and is exactly the kind of timing luck this repo keeps paying for.
    poll-interval-ms: ${LARGATA_REPORTS_POLL_INTERVAL_MS:60000}
    poll-initial-delay-ms: ${LARGATA_REPORTS_POLL_INITIAL_DELAY_MS:60000}
  storage:
    # S3-class object storage (ADR-021). Endpoint-driven so the same code speaks to Garage locally
    # and Railway Buckets or R2 on a deployed rung. Unset endpoint = no bucket = UnconfiguredObjectStore,
    # which refuses honestly; media is the only thing that stops working.
    #
    # `region` is signing input, not routing: SigV4 requires one even when the endpoint is overridden,
    # and any stable value satisfies a non-AWS store (R2 documents "auto").
    endpoint: ${LARGATA_STORAGE_ENDPOINT:}
    bucket: ${LARGATA_STORAGE_BUCKET:largata-media}
    access-key: ${LARGATA_STORAGE_ACCESS_KEY:}
    secret-key: ${LARGATA_STORAGE_SECRET_KEY:}
    region: ${LARGATA_STORAGE_REGION:us-east-1}

  place:
    # Keyless place search, proxied (PL-2). Photon (photon.komoot.io) is the geocoder: Nominatim is
    # excluded by its OWN policy, which states that auto-complete "is not yet supported by Nominatim
    # and you must not implement such a service on the client side". Never called client-direct — the
    # mobile layering guard forbids raw fetch, the free services identify and rate-limit by caller,
    # and a proxy is the only place a cache and a provider swap can live.
    #
    # UNSET URL = no Photon bean = FixturePlaceSuggester, and that is the DELIBERATE local and CI
    # posture: no integration test ever calls Komoot, so the suite never spends a stranger's free
    # quota nor goes red when their service is down. The two beans are a mutually exclusive
    # @ConditionalOnExpression pair, never @ConditionalOnMissingBean — that is autoconfiguration-only
    # machinery, and in an ordinary @Configuration it is decoration that lets BOTH beans register
    # (the WS-1 finding).
    photon-url: ${LARGATA_PHOTON_URL:}
    # Photon splits forward and reverse across two paths. Both are configuration rather than one
    # derived from the other: deriving meant string surgery on a URL, which mangles any host whose
    # own name contains the forward path and silently reverses against the wrong one.
    photon-reverse-url: ${LARGATA_PHOTON_REVERSE_URL:https://photon.komoot.io/reverse}
    # The fixture is a DEFAULT, and a default that ships is a silent downgrade: a deployed rung with
    # no photon-url would serve eight hardcoded places and say nothing, so search would quietly know
    # only El Nido, Manila, Sapporo and Helsinki. This flag makes that state opt-in and its absence
    # fatal — docker-compose and the test classpath set it, nothing else does, so a deployment
    # missing its geocoder REFUSES TO START instead of degrading where nobody is looking.
    #
    # Deliberately not keyed on the profile: tests run with NO profile, exactly as prod does, so a
    # profile cannot tell them apart. Deliberately not keyed on a platform variable either — that
    # guards only while we stay on that platform, and stops guarding silently when we leave.
    fixture-allowed: ${LARGATA_PLACE_FIXTURE_ALLOWED:false}
    # OSM/Photon policy requires an outbound identification that names the application. A browser
    # cannot set one, which is a second reason search runs server-side rather than from the app.
    user-agent: ${LARGATA_PLACE_USER_AGENT:Largata/1.0 (+https://largata.com)}
    # The raster tile source, SERVER-SUPPLIED CONFIGURATION rather than a constant in the app.
    # OSM's tile policy is explicit that access is best-effort and "may be withdrawn at any point",
    # and its own advice is to keep the source switchable — so a provider withdrawing access is a
    # config change, not an app release. Esri is the recorded fallback: keyed, but commercial use
    # permitted. Attribution is a LICENCE OBLIGATION and travels with the URL for that reason.
    tile-url: ${LARGATA_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    tile-attribution: ${LARGATA_TILE_ATTRIBUTION:© OpenStreetMap contributors}
    tile-attribution-url: ${LARGATA_TILE_ATTRIBUTION_URL:https://www.openstreetmap.org/copyright}

server:
  port: ${PORT:8080}
  error:
    # Belt and braces for P2: even if something escaped the handler, Spring's default error
    # page must not render internals to a client.
    include-stacktrace: never
    include-message: never

logging:
  # Structured JSON (06b §4). Boot's built-in ECS/logstash structured format — no extra dependency.
  structured:
    format:
      console: ecs
