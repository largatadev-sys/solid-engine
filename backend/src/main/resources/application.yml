spring:
  application:
    name: largata-backend
  datasource:
    # Config is env-vars only (Artifact 04). Defaults here are local-dev conveniences, never
    # secrets — real values come from the environment; prod sets them in the platform's UI.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/largata}
    username: ${DATABASE_USERNAME:largata}
    password: ${DATABASE_PASSWORD:largata}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch DDL — an accidental `update` would
      # silently diverge environments from the migration history.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # Boot's default is ONE thread, and every @Scheduled task in the app shares it: the WS
        # heartbeat that detects dead sessions, and the connection-ticket sweeper. A ping walking a
        # wedged socket therefore delays the sweeper AND the next round of pings — the mechanism
        # that detects dead sessions blocked by dead sessions. Nothing goes red when it happens;
        # the tasks simply queue. SchedulerPoolIT holds the line (S4.35 ticket 01).
        size: 4
  servlet:
    multipart:
      # Slightly above ImageIngest.MAX_UPLOAD_BYTES (10 MB) on purpose. Spring rejects at this bound
      # with a container-level error; the domain rejects at 10 MB with a message naming the limit.
      # Leaving room between them means a traveler a little over the line reads our refusal rather
      # than the servlet's, while a wildly oversized upload is still stopped before it is buffered.
      max-file-size: 12MB
      max-request-size: 12MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firebase's issuer for our project (ADR-006). Per-environment: the largata-dev project
          # serves local + dev; prod gets its own project at S0.4 — and preprod must share prod's,
          # or its prod-mirrored Travelers (keyed by Firebase UID) match no one (spec, decision 1).
          # Not a secret: the issuer is public, and the JWKS behind it is public by design.
          issuer-uri: ${FIREBASE_ISSUER_URI:https://securetoken.google.com/largata-dev}

largata:
  auth:
    jwks:
      # Google signs every Firebase ID token with the securetoken service account, so this JWKS is
      # the same for every project — the issuer above stays per-environment, the keys do not.
      # JwtDecoderConfig refreshes this set AHEAD of expiry and serves the cached copy through an
      # outage (cache-ttl / refresh-ahead / outage-tolerance, defaults in the config class). Before
      # that, an expired cache blocked every authenticated request on the refetch, and a slow
      # answer from Google surfaced as "Timeout while waiting for cache refresh (15000ms
      # exceeded)" 500s across the whole API (found during S4.34's e2e runs).
      uri: ${LARGATA_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
  web:
    # Where a shared invite link points (S4.28, ADR-032). The share URL is composed server-side —
    # `<base>/join/<token>` — so links open the web app today and the same URLs can be claimed as
    # Android App Links later without reprinting anything already forwarded through a chat.
    # Per-environment: the local default is the preview container's pinned 8081.
    base-url: ${LARGATA_WEB_BASE_URL:http://localhost:8081}
  api:
    # Where THIS backend is reachable from the public internet (S4.29). The invite card's og:image
    # must be an absolute URL on the API origin: a crawler resolves it against nothing, and some
    # platforms fetch the image with a plain user agent that Caddy's crawler matcher would miss.
    # Per-environment: the local default is the compose backend's 8080.
    base-url: ${LARGATA_API_BASE_URL:http://localhost:8080}
  storage:
    # S3-class object storage (ADR-021). Endpoint-driven so the same code speaks to Garage locally
    # and Railway Buckets or R2 on a deployed rung. Unset endpoint = no bucket = UnconfiguredObjectStore,
    # which refuses honestly; media is the only thing that stops working.
    #
    # `region` is signing input, not routing: SigV4 requires one even when the endpoint is overridden,
    # and any stable value satisfies a non-AWS store (R2 documents "auto").
    endpoint: ${LARGATA_STORAGE_ENDPOINT:}
    bucket: ${LARGATA_STORAGE_BUCKET:largata-media}
    access-key: ${LARGATA_STORAGE_ACCESS_KEY:}
    secret-key: ${LARGATA_STORAGE_SECRET_KEY:}
    region: ${LARGATA_STORAGE_REGION:us-east-1}

server:
  port: ${PORT:8080}
  error:
    # Belt and braces for P2: even if something escaped the handler, Spring's default error
    # page must not render internals to a client.
    include-stacktrace: never
    include-message: never

logging:
  # Structured JSON (06b §4). Boot's built-in ECS/logstash structured format — no extra dependency.
  structured:
    format:
      console: ecs
