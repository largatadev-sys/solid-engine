# The suite runs with NO Spring profile, exactly as production does, so nothing about the profile
# distinguishes them. This file is what does: the tests opt in to the place fixture, and production
# — which sets neither this nor LARGATA_PHOTON_URL — refuses to start rather than silently serving
# eight hardcoded places. See largata.place.fixture-allowed in application.yml.
largata.place.fixture-allowed=true
